name: update-data-and-predictions
on:
  schedule:
    - cron: "0 1 * * 1-5"     # 08:00 เวลาไทย  -> สร้างคำทายของงวดวันนี้ (ก่อนผลออก)
    - cron: "30 14 * * 1-5"   # 21:30 เวลาไทย  -> ดึงผลใหม่ + สร้างคำทายงวดถัดไป
    - cron: "30 16 * * 1-5"   # 23:30 เวลาไทย  -> ดึงผลซ้ำเผื่อเว็บต้นทางอัปเดตช้า
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
      - run: python scripts/log_predictions.py
      - name: commit
        run: |
          git config user.name "lao-bot"
          git config user.email "lao-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: update $(date -u +%F-%H%M)" && git push)
